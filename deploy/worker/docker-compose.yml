# Projeto Compose isolado (nome explícito + container próprio) pra coexistir
# na MESMA VPS do stack do ZapScript sem colidir com os containers dele —
# ver deploy/worker/README.md, seção "Coexistindo com o ZapScript".
#
# SEM Redis aqui de propósito: o webhook do WhatsApp roda na Vercel e
# enfileira jobs direto no Redis via BullMQ (packages/core/src/queues/
# definitions.ts) — ele nunca fala com este worker por HTTP. Um Redis
# self-hosted nesta VPS, sem porta pública, seria inalcançável pela Vercel;
# com porta pública, seria um Redis na internet só com senha (sem TLS) pra
# proteger mensagens com dado financeiro em trânsito. Por isso REDIS_URL
# aqui aponta pro mesmo Redis gerenciado (Upstash, TLS nativo) que a Vercel
# usa — ver deploy/worker/README.md.
name: zapbuddy-worker

services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile
    container_name: zapbuddy-worker
    restart: always
    env_file:
      - .env
