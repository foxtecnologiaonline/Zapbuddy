# Projeto Compose isolado (nome explícito + nomes de container/rede/volume
# próprios) pra coexistir na MESMA VPS do stack do ZapScript sem colidir
# com os containers dele (evolution-api, postgres, redis, nginx/caddy) —
# ver deploy/worker/README.md, seção "Coexistindo com o ZapScript".
name: zapbuddy-worker

services:
  redis:
    image: redis:7-alpine
    container_name: zapbuddy-redis
    restart: always
    # Sem "ports:" de propósito — só o container do worker, na rede
    # "zapbuddy-net" abaixo, precisa falar com este Redis. Nada escuta na
    # porta 6379 pra fora da VPS, e esta rede é separada da que o
    # ZapScript usa (evo-net/a dele) — containers de um não enxergam os do
    # outro a não ser pelo host (nenhuma chamada daqui depende disso: o
    # worker fala com a Evolution API via https://evo.zapscript.me público,
    # igual a Vercel faria).
    command: redis-server --appendonly yes
    volumes:
      - zapbuddy-redis-data:/data
    networks:
      - zapbuddy-net

  worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile
    container_name: zapbuddy-worker
    restart: always
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - zapbuddy-net

networks:
  zapbuddy-net:
    name: zapbuddy-net

volumes:
  zapbuddy-redis-data:
