name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm test
      - run: npm run build --workspace=apps/web
      # Bloqueia só vulnerabilidade crítica em dependência de produção. `zod` (alto,
      # exige major 4) está como risco aceito — ver CLAUDE.md, seção de segurança.
      - run: npm audit --omit=dev --audit-level=critical
